version: '3.8'

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
    env_file:
      - ./server/.env
    networks:
      - app-network
    restart: always

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    env_file:
      - ./client/.env
    depends_on:
      - api
    networks:
      - app-network
    restart: always
    mem_limit: 512m
    cpus: 0.5

networks:
  app-network:
    driver: bridge
